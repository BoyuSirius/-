<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山东铁塔未知资产发现测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f0f4f8;
      color: #1f2937;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #0b5394, #1468b0);
      color: #fff;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    header .title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    header .sub { font-size: 12px; opacity: .85; margin-top: 4px; }
    header .badge {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
    }
    main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .card h2 {
      font-size: 15px;
      color: #0b5394;
      border-left: 4px solid #0b5394;
      padding-left: 10px;
      margin-bottom: 16px;
    }
    .row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: #6b7280; }
    .field input, .field select {
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      min-width: 260px;
      background: #fff;
      color: inherit;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #0b5394; }
    button {
      height: 38px;
      padding: 0 22px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary { background: #0b5394; color: #fff; }
    .btn-primary:hover { background: #1468b0; }
    .btn-danger  { background: #b91c1c; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost  { background: #e5e7eb; color: #374151; }
    .btn-ghost:hover { background: #d1d5db; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chips .chip {
      background: #eef2f7;
      border: 1px solid #d1dbe8;
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 12px;
      color: #0b5394;
      cursor: pointer;
      user-select: none;
    }
    .chips .chip.active { background: #0b5394; color: #fff; border-color: #0b5394; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: center;
    }
    .stat .num { font-size: 26px; font-weight: 700; color: #0b5394; }
    .stat.unknown .num { color: #b91c1c; }
    .stat .desc { font-size: 12px; color: #6b7280; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #eef1f4;
    }
    th { background: #f8fafc; color: #374151; font-weight: 600; white-space: nowrap; }
    tr:hover td { background: #f5f9ff; }
    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .tag.unknown { background: #fee2e2; color: #b91c1c; }
    .tag.known   { background: #dcfce7; color: #15803d; }
    #progress-wrap { display: none; margin-top: 14px; }
    #progress-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0b5394, #2f9df6);
      transition: width .2s;
    }
    #progress-text { font-size: 12px; color: #6b7280; margin-top: 6px; }
    .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .empty { text-align: center; color: #9ca3af; padding: 30px 0; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">山东铁塔未知资产发现测试</div>
      <div class="sub" id="project-info"></div>
    </div>
    <div class="badge">测试环境 · 内网资产探测</div>
  </header>

  <main>
    <!-- 扫描配置区域 -->
    <section class="card">
      <h2>扫描配置</h2>
      <div class="row">
        <div class="field">
          <label for="target">扫描目标（IP / 范围 / 空格分隔）</label>
          <input id="target" type="text" value="1.1.1.1 192.168.0.9" />
          <div class="chips">
            <span class="chip" data-v="1.1.1.1">1.1.1.1</span>
            <span class="chip" data-v="192.168.0.9">192.168.0.9</span>
            <span class="chip" data-v="192.168.0.0/24">192.168.0.0/24</span>
          </div>
        </div>
        <div class="field">
          <label for="ports">探测端口（逗号分隔）</label>
          <input id="ports" type="text" value="22,80,443,3389,8080,8443,8888,9000" />
        </div>
        <div class="field">
          <label for="concurrency">并发数</label>
          <select id="concurrency">
            <option>10</option>
            <option>50</option>
            <option>200</option>
          </select>
        </div>
        <button id="btn-scan" class="btn-primary">开始扫描</button>
        <button id="btn-stop" class="btn-danger" disabled>停止</button>
      </div>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text"></div>
      </div>
    </section>

    <!-- 统计概览 -->
    <section class="card">
      <h2>扫描概览</h2>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="st-total">0</div><div class="desc">已探测资产</div></div>
        <div class="stat"><div class="num" id="st-alive">0</div><div class="desc">在线主机</div></div>
        <div class="stat unknown"><div class="num" id="st-unknown">0</div><div class="desc">未知资产</div></div>
        <div class="stat"><div class="num" id="st-known">0</div><div class="desc">已备案资产</div></div>
      </div>
    </section>

    <!-- 资产列表 -->
    <section class="card">
      <h2>资产列表</h2>
      <table>
        <thead>
          <tr>
            <th>IP 地址</th>
            <th>在线状态</th>
            <th>开放端口</th>
            <th>识别类型</th>
            <th>资产状态</th>
          </tr>
        </thead>
        <tbody id="asset-body"></tbody>
      </table>
      <div class="empty" id="asset-empty">尚未开始扫描，请配置目标后点击「开始扫描」</div>
      <div class="toolbar">
        <button id="btn-export" class="btn-ghost" disabled>导出 CSV</button>
        <button id="btn-clear" class="btn-ghost">清空结果</button>
      </div>
    </section>
  </main>

  <script>
    // ============ 前端模拟数据 ============
    // 模拟未知资产发现引擎返回结果；实际部署时可替换为对后端接口的 fetch 调用。
    const MOCK_POOL = [
      { ip: '1.1.1.1',        alive: true,  ports: [80, 443, 8080],   type: '未知设备（疑似出口网关）' },
      { ip: '192.168.0.9',    alive: true,  ports: [80, 3389, 443],    type: 'OA服务器' },
      { ip: '192.168.0.10',   alive: true,  ports: [445, 139],         type: 'NAS存储' },
      { ip: '192.168.0.11',   alive: false, ports: [],                 type: '无' },
      { ip: '192.168.0.12',   alive: true,  ports: [23, 8080],         type: '未知设备（疑似网络设备）' },
      { ip: '192.168.0.13',   alive: false, ports: [],                 type: '无' },
      { ip: '192.168.0.15',   alive: true,  ports: [8080, 7001],       type: '未知中间件（疑似 WebLogic）' },
    ];

    // 已备案资产 IP（对应后端 KNOWN_ASSETS）
    const KNOWN_IPS = ['192.168.0.9', '192.168.0.10'];

    // ============ 日志工具 ============
    function setStatus(text) {
      document.getElementById('progress-text').textContent = text;
    }

    // ============ 扫描流程 ============
    let scanning = false;
    let timer = null;

    function startScan() {
      const target = document.getElementById('target').value.trim();
      if (!target) { alert('请填写扫描目标'); return; }

      scanning = true;
      document.getElementById('btn-scan').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      document.getElementById('btn-export').disabled = true;
      document.getElementById('asset-body').innerHTML = '';
      document.getElementById('asset-empty').style.display = 'block';
      document.getElementById('asset-empty').textContent = '正在扫描 ' + target + ' ...';
      document.getElementById('progress-wrap').style.display = 'block';

      let progress = 0;
      const total = MOCK_POOL.length;
      timer = setInterval(() => {
        progress += 1;
        const pct = Math.min(100, Math.round((progress / total) * 100));
        document.getElementById('progress-fill').style.width = pct + '%';
        setStatus('扫描进行中：' + progress + ' / ' + total + '（' + pct + '%），目标：' + target);
        if (progress >= total) {
          clearInterval(timer);
          finishScan();
        }
      }, 300);
    }

    function finishScan() {
      scanning = false;
      document.getElementById('btn-scan').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('btn-export').disabled = false;
      document.getElementById('progress-fill').style.width = '100%';
      setStatus('扫描完成');

      renderResults(MOCK_POOL);
    }

    function stopScan() {
      scanning = false;
      clearInterval(timer);
      document.getElementById('btn-scan').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('btn-export').disabled = false;
      setStatus('扫描已被手动停止');
    }

    // ============ 结果渲染 ============
    function renderResults(results) {
      const tbody = document.getElementById('asset-body');
      tbody.innerHTML = '';
      document.getElementById('asset-empty').style.display = 'none';

      let alive = 0, known = 0;
      results.forEach((r) => {
        if (r.alive) alive++;
        const isKnown = KNOWN_IPS.includes(r.ip);
        if (isKnown) known++;

        const status = KNOWN_IPS.includes(r.ip) ? '已备案' : '未知';
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + r.ip + '</td>' +
          '<td>' + (r.alive ? '● 在线' : '○ 离线') + '</td>' +
          '<td>' + (r.ports.length ? r.ports.join(', ') : '-') + '</td>' +
          '<td>' + r.type + '</td>' +
          '<td><span class="tag ' + (isKnown ? 'known' : 'unknown') + '">' + status + '</span></td>';
        tbody.appendChild(tr);
      });

      document.getElementById('st-total').textContent = results.length;
      document.getElementById('st-alive').textContent = alive;
      document.getElementById('st-unknown').textContent = results.length - known;
      document.getElementById('st-known').textContent = known;
    }

    // ============ 导出 CSV ============
    function exportCsv() {
      const rows = [['IP', '在线', '开放端口', '识别类型', '资产状态']];
      MOCK_POOL.forEach((r) => {
        const isKnown = KNOWN_IPS.includes(r.ip);
        rows.push([
          r.ip,
          r.alive ? '在线' : '离线',
          r.ports.join('; '),
          r.type,
          isKnown ? '已备案' : '未知',
        ]);
      });
      const csv = rows.map((row) => row.map((c) => '"' + c + '"').join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'assset_discovery_result.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ============ 事件绑定 ============
    document.getElementById('btn-scan').addEventListener('click', startScan);
    document.getElementById('btn-stop').addEventListener('click', stopScan);

    document.getElementById('btn-clear').addEventListener('click', () => {
      document.getElementById('asset-body').innerHTML = '';
      document.getElementById('asset-empty').style.display = 'block';
      document.getElementById('asset-empty').textContent = '尚未开始扫描，请配置目标后点击「开始扫描」';
      document.getElementById('st-total').textContent = '0';
      document.getElementById('st-alive').textContent = '0';
      document.getElementById('st-unknown').textContent = '0';
      document.getElementById('st-known').textContent = '0';
      document.getElementById('btn-export').disabled = true;
      document.getElementById('progress-wrap').style.display = 'none';
    });

    document.getElementById('btn-export').addEventListener('click', exportCsv);

    // 快捷目标 chips
    document.querySelectorAll('.chips .chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.getElementById('target').value = chip.dataset.v;
        document.querySelectorAll('.chips .chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
      });
    });

    // ============ 初始化 ============
    document.getElementById('project-info').textContent =
      '扫描任务对象：内网资产（示例：1.1.1.1 / 192.168.0.9）';
  </script>
</body>
</html>
